name: Backend Tests

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    name: Python Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run regression tests
        working-directory: backend
        run: uv run python -m unittest discover -s tests/regression -v

      - name: Create Firebase configuration
        working-directory: backend
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_JSON }}
          FIREBASE_ADMIN_JSON: ${{ secrets.FIREBASE_ADMIN_JSON }}
        run: |
          printf '%s' "$FIREBASE_JSON" > firebase.json
          printf '%s' "$FIREBASE_ADMIN_JSON" > firebase-admin.json

      - name: Start backend server
        working-directory: backend
        run: |
          uv run uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 5000 \
            > server.log 2>&1 &

          echo $! > server.pid
          sleep 3

          echo "=== Backend startup log ==="
          cat server.log

          if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
            echo "Backend process exited during startup"
            exit 1
          fi

      - name: Wait for backend
        working-directory: backend
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/health; then
              echo
              echo "Backend is ready"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend failed to become ready"
          echo "=== Backend log ==="
          cat server.log
          exit 1

      - name: Run live tests
        working-directory: backend
        env:
          SIGNBRIDGE_RUN_LIVE_TESTS: "1"
        run: |
          uv run python -m unittest discover -s tests/live -v

      - name: Show backend logs
        if: always()
        working-directory: backend
        run: |
          if [ -f server.log ]; then
            cat server.log
          fi

      - name: Stop backend server
        if: always()
        working-directory: backend
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi